name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Clippy check
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt --check
        continue-on-error: true

  coverage-gap-self-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Build (instrumented)
        run: |
          RUSTFLAGS="-Cinstrument-coverage" cargo build

      - name: Test (instrumented)
        run: |
          RUSTFLAGS="-Cinstrument-coverage" cargo test

      - name: Export coverage
        run: |
          cargo install cargo-llvm-cov
          cargo llvm-cov --json --output-path coverage.json || true

      - name: Analyze our own coverage gaps
        run: |
          cargo run -- coverage.json --summary 2>/dev/null || echo "Skipping gap self-test (no coverage data yet)"

  docs:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build docs
        run: cargo doc --no-deps

      - name: Upload docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
